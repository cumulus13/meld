name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install dependencies
        run: dnf install -y git gtk4 gtksourceview5 libadwaita python3-cairo python3-gobject-base uv xorg-x11-server-Xvfb
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/uv
          key: lint-${{ hashFiles('pyproject.toml', '.pre-commit-config.yaml') }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: build-aux/ci/check.sh lint

  pytest:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install dependencies
        run: dnf install -y git gtk4 gtksourceview5 libadwaita python3-cairo python3-gobject-base uv xorg-x11-server-Xvfb
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: pytest-${{ hashFiles('pyproject.toml') }}
      - run: build-aux/ci/check.sh test

  flatpak:
    runs-on: ubuntu-latest
    # Tracks the GNOME nightly runtime like the GitLab job; may break on its own.
    continue-on-error: true
    container:
      # Same image the GNOME flatpak CI template uses; it ships flatpak-builder
      # and the org.gnome.Platform//master runtime that the Devel manifest needs.
      # (flathub-infra/flatpak-github-actions only publishes stable gnome-NN tags.)
      image: quay.io/gnome_infrastructure/gnome-runtime-images:gnome-master
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >-
          flatpak-builder --user --disable-rofiles-fuse --force-clean
          --repo=repo flatpak_app build-aux/org.gnome.Meld.Devel.json
      - name: Bundle
        run: >-
          flatpak build-bundle repo meld-dev.flatpak
          --runtime-repo=https://nightly.gnome.org/gnome-nightly.flatpakrepo
          org.gnome.Meld.Devel
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: meld-dev.flatpak

  windows:
    runs-on: windows-latest
    # Rolling msys2 packages can break this; it exists to produce installers.
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      # The MSYS2 nsis package cannot find its nsDialogs plugin ("Plugin not
      # found, cannot call nsDialogs::Create", empty plugin directory list);
      # use the official NSIS build that meld.nsis was written against.
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.11 -y --no-progress
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # The restored package cache never prevented the re-download.
          cache: false
      - name: Install dependencies
        # Mirrors (ftp2.osuosl.org) regularly stall with "Operation too slow",
        # so disable the low-speed timeout and retry the whole transaction.
        run: |
          sed -i '/^\[options\]/a DisableDownloadTimeout' /etc/pacman.conf
          for attempt in 1 2 3; do
            # pacboy comes from pactoys; setup-msys2 only installs it when its
            # own `pacboy:` input is used.
            if pacman --noconfirm -S --needed pactoys && pacboy --noconfirm -S --needed \
                adwaita-icon-theme:p appstream:p desktop-file-utils:p gettext:p \
                gsettings-desktop-schemas:p gtk-update-icon-cache:p gtk4:p \
                gtksourceview5:p itstool:p libadwaita:p meson:p \
                pyinstaller:p python-gobject:p python-lxml:p python-markupsafe:p \
                python-pip:p python-pytest:p python-yaml:p glib2:p; then
              exit 0
            fi
            echo "pacboy attempt $attempt failed" >&2
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build installer
        run: |
          pip install --break-system-packages pyinstaller-versionfile
          meson setup --prefix=/ . meson-build/
          meson compile -v -C meson-build/
          meson install -C meson-build/ --destdir=pyinstaller-build/
          # Under MSYS2 "--prefix=/" is rewritten to the msys root, so the tree
          # lands in pyinstaller-build/a/_temp/msys64/{bin,lib,share}. meld.spec
          # expects lib/ and share/ directly in pyinstaller-build: hoist them.
          # mv, not cp -a: cp chokes recreating the help/*/figures symlinks.
          inst=meson-build/pyinstaller-build
          pydir=$(find "$inst" -type d -path '*/lib/python3.*' -prune | head -n1)
          test -n "$pydir" || { echo "no installed python lib under $inst" >&2; exit 1; }
          root=$(dirname "$(dirname "$pydir")")
          if [ "$root" != "$inst" ]; then
            mv "$root"/* "$inst"/
          fi
          find "$inst/share" -xtype l -print -delete
          ls "$inst" "$inst/lib"
          cp windows/meld.spec meson-build/pyinstaller-build
          cd meson-build/pyinstaller-build
          pyinstaller ./meld.spec
          cp version.nsh dist/
          cp ../../windows/meld.nsis dist/
          cd dist
          nsis=$(cygpath -u 'C:\Program Files (x86)\NSIS\makensis.exe')
          test -x "$nsis" || { echo "NSIS not found at $nsis" >&2; exit 1; }
          "$nsis" -VERSION
          ls "$(dirname "$nsis")/Plugins"
          "$nsis" /X"AddPluginDir 'C:\Program Files (x86)\NSIS\Plugins\x86-unicode'" ./meld.nsis
          mv meld-*.exe "$(cygpath -u "$GITHUB_WORKSPACE")/"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: meld-*.exe
